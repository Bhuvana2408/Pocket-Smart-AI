<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Recommendation History - Pocket Smart AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* HEADER */

        header {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* NAVIGATION */

        nav {
            background: white;
            padding: 14px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            margin-right: 25px;
            font-weight: 600;
        }

        nav a:hover {
            color: #2563eb;
        }

        /* MAIN */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* SUMMARY */

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .summary-card h3 {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .summary-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        /* BUTTON */

        .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        /* HISTORY CARD */

        .history-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #2563eb;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .history-header h3 {
            font-size: 18px;
            color: #111827;
        }

        .history-id {
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .history-message {
            line-height: 1.7;
            color: #374151;
            white-space: normal;
        }

        .history-message h4 {
            margin-top: 15px;
            margin-bottom: 7px;
            color: #111827;
        }

        .history-message p {
            margin-bottom: 10px;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* EMPTY */

        .empty-box {
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .empty-box h3 {
            margin-bottom: 10px;
        }

        .empty-box p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .ai-btn {
            display: inline-block;
            background: #7c3aed;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
        }

        .ai-btn:hover {
            background: #6d28d9;
        }

        /* ERROR */

        .error-box {
            background: #fef2f2;
            color: #b91c1c;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            nav {
                padding: 14px 20px;
                overflow-x: auto;
                white-space: nowrap;
            }

            nav a {
                margin-right: 15px;
            }

            .container {
                margin: 25px auto;
            }

            .history-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>💰 Pocket Smart AI</h1>

        <div class="user-section">

            <span>
                Welcome, <strong id="userName">User</strong>
            </span>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <a href="/dashboard-page">Dashboard</a>

        <a href="/expenses-page">Expenses</a>

        <a href="/budget-page">Budget</a>

        <a href="/reports-page">Reports</a>

        <a href="/history-page">History</a>

        <a href="/ai-page">AI Recommendations</a>

        <a href="/ai-history-page">AI History</a>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="page-title">

            <h2>🤖 AI Recommendation History</h2>

            <p>
                View your previous AI-generated financial recommendations.
            </p>

        </div>


        <!-- SUMMARY -->

        <div class="summary-card">

            <h3>Total AI Recommendations</h3>

            <div
                class="number"
                id="recommendationCount">
                0
            </div>

        </div>


        <!-- REFRESH -->

        <button
            class="refresh-btn"
            onclick="loadHistory()">

            🔄 Refresh History

        </button>


        <!-- ERROR -->

        <div
            id="errorBox"
            class="error-box"
            style="display:none;">
        </div>


        <!-- HISTORY -->

        <div id="historyContainer">

            <div class="loading">

                Loading AI recommendation history...

            </div>

        </div>

    </main>


    <script>

        // =========================================
        // CHECK LOGIN
        // =========================================

        const userId = localStorage.getItem("user_id");

        const userName =
            localStorage.getItem("user_name");


        if (!userId) {

            window.location.href = "/login-page";

        }


        // =========================================
        // SHOW USER NAME
        // =========================================

        if (userName) {

            document.getElementById("userName").textContent =
                userName;

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem("user_id");

            localStorage.removeItem("user_name");

            localStorage.removeItem("user_email");

            window.location.href = "/login-page";

        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text ?? "";

            return div.innerHTML;

        }


        // =========================================
        // FORMAT AI MESSAGE
        // =========================================

        function formatAIText(text) {

            if (!text) {

                return "No recommendation message available.";

            }


            let safeText = escapeHTML(text);


            // Convert markdown headings
            safeText = safeText.replace(
                /^### (.*)$/gm,
                "<h4>$1</h4>"
            );

            safeText = safeText.replace(
                /^## (.*)$/gm,
                "<h4>$1</h4>"
            );

            safeText = safeText.replace(
                /^# (.*)$/gm,
                "<h4>$1</h4>"
            );


            // Convert bold text
            safeText = safeText.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


            // Convert line breaks
            safeText = safeText.replace(
                /\n/g,
                "<br>"
            );


            return safeText;

        }


        // =========================================
        // LOAD AI HISTORY
        // =========================================

        async function loadHistory() {

            const container =
                document.getElementById(
                    "historyContainer"
                );

            const errorBox =
                document.getElementById(
                    "errorBox"
                );


            errorBox.style.display = "none";


            container.innerHTML = `

                <div class="loading">

                    ⏳ Loading recommendation history...

                </div>

            `;


            try {

                const response = await fetch(
                    `/recommendations/history/${userId}`
                );


                const data = await response.json();


                // -------------------------------------
                // ERROR
                // -------------------------------------

                if (data.status !== "success") {

                    throw new Error(
                        data.message ||
                        "Unable to load history."
                    );

                }


                // -------------------------------------
                // UPDATE COUNT
                // -------------------------------------

                document.getElementById(
                    "recommendationCount"
                ).textContent = data.count;


                // -------------------------------------
                // NO HISTORY
                // -------------------------------------

                if (
                    !data.recommendations ||
                    data.recommendations.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty-box">

                            <h3>
                                📭 No AI Recommendations Yet
                            </h3>

                            <p>
                                Generate your first AI
                                financial recommendation
                                to see it here.
                            </p>

                            <a
                                href="/ai-page"
                                class="ai-btn">

                                🤖 Go to AI Recommendations

                            </a>

                        </div>

                    `;

                    return;

                }


                // -------------------------------------
                // DISPLAY HISTORY
                // -------------------------------------

                container.innerHTML = "";


                data.recommendations.forEach(
                    (recommendation) => {

                        const card =
                            document.createElement("div");


                        card.className =
                            "history-card";


                        card.innerHTML = `

                            <div class="history-header">

                                <h3>
                                    🤖 ${escapeHTML(
                                        recommendation.title
                                    )}
                                </h3>

                                <span class="history-id">

                                    Recommendation #${recommendation.id}

                                </span>

                            </div>


                            <div class="history-message">

                                ${formatAIText(
                                    recommendation.message
                                )}

                            </div>

                        `;


                        container.appendChild(card);

                    }
                );

            }


            catch (error) {

                console.error(
                    "History error:",
                    error
                );


                errorBox.textContent =
                    "❌ " +
                    (
                        error.message ||
                        "Unable to load AI history."
                    );


                errorBox.style.display =
                    "block";


                container.innerHTML = "";

            }

        }


        // =========================================
        // LOAD WHEN PAGE OPENS
        // =========================================

        loadHistory();

    </script>

</body>

</html>
