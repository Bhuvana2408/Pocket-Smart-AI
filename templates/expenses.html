<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenses - Pocket Smart AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            background: white;
            color: #4f46e5;
            font-weight: bold;
            cursor: pointer;
        }

        .nav {
            background: white;
            padding: 15px 40px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .nav button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #eef2ff;
            color: #4338ca;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #4f46e5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .form-buttons {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .primary-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #4338ca;
        }

        .cancel-btn {
            display: none;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            background: #6b7280;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #eef2ff;
            color: #4338ca;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .edit-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            background: #f59e0b;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            background: #ef4444;
            color: white;
            cursor: pointer;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            opacity: 0.85;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {

            .header {
                padding: 18px 20px;
            }

            .nav {
                padding: 12px 20px;
                flex-wrap: wrap;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            💰 Pocket Smart AI
        </div>

        <div class="user-area">

            <span id="userName">
                User
            </span>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="nav">

        <button onclick="goDashboard()">
            🏠 Dashboard
        </button>

        <button onclick="goExpenses()">
            💰 Expenses
        </button>

        <button onclick="goBudget()">
            📊 Budget
        </button>

        <button onclick="goAI()">
            🤖 AI
        </button>

    </div>


    <div class="container">

        <!-- TITLE -->

        <div class="title">

            <h1>
                💰 Expense Management
            </h1>

            <p>
                Add, edit and delete your expenses.
            </p>

        </div>


        <!-- ADD / EDIT FORM -->

        <div class="card">

            <h2 id="formTitle">
                ➕ Add Expense
            </h2>

            <div class="form-grid">

                <input
                    type="text"
                    id="category"
                    placeholder="Category (Food, Travel, Shopping...)"
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    min="0"
                    step="0.01"
                >

                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                >

                <input
                    type="text"
                    id="date"
                    placeholder="Date (DD-MM-YYYY)"
                >

            </div>


            <div class="form-buttons">

                <button
                    class="primary-btn"
                    id="saveBtn"
                    onclick="saveExpense()">
                    ➕ Add Expense
                </button>

                <button
                    class="cancel-btn"
                    id="cancelBtn"
                    onclick="cancelEdit()">
                    Cancel
                </button>

            </div>


            <div
                id="message"
                class="message">
            </div>

        </div>


        <!-- EXPENSE HISTORY -->

        <div class="card">

            <h2>
                📋 Expense History
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="expenseTable">

                        <tr>

                            <td colspan="6">
                                Loading expenses...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        const userId =
            localStorage.getItem("user_id");

        const userName =
            localStorage.getItem("user_name");


        let editingExpenseId = null;


        // =========================
        // LOGIN CHECK
        // =========================

        if (!userId) {

            window.location.href =
                "/login-page";

        }


        // =========================
        // SHOW USER NAME
        // =========================

        if (userName) {

            document.getElementById("userName")
                .textContent = userName;

        }


        // =========================
        // NAVIGATION
        // =========================

        function goDashboard() {

            window.location.href =
                "/dashboard-page";

        }


        function goExpenses() {

            window.location.href =
                "/expenses-page";

        }


        function goBudget() {

            window.location.href =
                "/budget-page";

        }


        function goAI() {

            window.location.href =
                "/ai-page";

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem("user_id");
            localStorage.removeItem("user_name");
            localStorage.removeItem("user_email");

            window.location.href =
                "/login-page";

        }


        // =========================
        // LOAD EXPENSES
        // =========================

        async function loadExpenses() {

            try {

                const response =
                    await fetch(
                        `/expenses/user/${userId}`
                    );

                const data =
                    await response.json();

                const table =
                    document.getElementById(
                        "expenseTable"
                    );


                if (
                    data.status !== "success" ||
                    !data.expenses
                ) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="6">
                                No expenses found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                if (data.expenses.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="6">
                                No expenses found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                table.innerHTML = "";


                data.expenses.forEach(expense => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${expense.id}
                        </td>

                        <td>
                            ${escapeHTML(expense.category)}
                        </td>

                        <td>
                            ₹${Number(expense.amount)
                                .toLocaleString("en-IN")}
                        </td>

                        <td>
                            ${escapeHTML(
                                expense.description || "-"
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                expense.date || "-"
                            )}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick='editExpense(${JSON.stringify(expense)})'>
                                ✏️ Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteExpense(${expense.id})">
                                🗑️ Delete
                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });

            }

            catch (error) {

                document.getElementById(
                    "expenseTable"
                ).innerHTML = `
                    <tr>
                        <td colspan="6">
                            ❌ Failed to load expenses.
                        </td>
                    </tr>
                `;

            }

        }


        // =========================
        // ADD / UPDATE EXPENSE
        // =========================

        async function saveExpense() {

            const category =
                document.getElementById(
                    "category"
                ).value.trim();

            const amount =
                document.getElementById(
                    "amount"
                ).value;

            const description =
                document.getElementById(
                    "description"
                ).value.trim();

            const date =
                document.getElementById(
                    "date"
                ).value.trim();


            if (!category || !amount) {

                showMessage(
                    "Please enter category and amount.",
                    "error"
                );

                return;

            }


            try {

                let url;

                let method;


                // UPDATE
                if (editingExpenseId) {

                    url =
                        `/expenses/update/${editingExpenseId}` +
                        `?user_id=${encodeURIComponent(userId)}` +
                        `&category=${encodeURIComponent(category)}` +
                        `&amount=${encodeURIComponent(amount)}` +
                        `&description=${encodeURIComponent(description)}` +
                        `&date=${encodeURIComponent(date)}`;

                    method = "PUT";

                }

                // ADD
                else {

                    url =
                        `/expenses/add` +
                        `?user_id=${encodeURIComponent(userId)}` +
                        `&category=${encodeURIComponent(category)}` +
                        `&amount=${encodeURIComponent(amount)}` +
                        `&description=${encodeURIComponent(description)}` +
                        `&date=${encodeURIComponent(date)}`;

                    method = "POST";

                }


                const response =
                    await fetch(
                        url,
                        {
                            method: method
                        }
                    );


                const data =
                    await response.json();


                if (data.status === "success") {

                    showMessage(
                        data.message,
                        "success"
                    );


                    clearForm();

                    loadExpenses();

                }

                else {

                    showMessage(
                        data.message ||
                        "Something went wrong.",
                        "error"
                    );

                }

            }

            catch (error) {

                showMessage(
                    "Server connection error.",
                    "error"
                );

            }

        }


        // =========================
        // EDIT EXPENSE
        // =========================

        function editExpense(expense) {

            editingExpenseId =
                expense.id;


            document.getElementById(
                "category"
            ).value =
                expense.category || "";


            document.getElementById(
                "amount"
            ).value =
                expense.amount || "";


            document.getElementById(
                "description"
            ).value =
                expense.description || "";


            document.getElementById(
                "date"
            ).value =
                expense.date || "";


            document.getElementById(
                "formTitle"
            ).textContent =
                "✏️ Edit Expense";


            document.getElementById(
                "saveBtn"
            ).textContent =
                "💾 Update Expense";


            document.getElementById(
                "cancelBtn"
            ).style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // =========================
        // CANCEL EDIT
        // =========================

        function cancelEdit() {

            editingExpenseId = null;

            clearForm();

        }


        // =========================
        // DELETE EXPENSE
        // =========================

        async function deleteExpense(expenseId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this expense?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/expenses/delete/${expenseId}` +
                        `?user_id=${encodeURIComponent(userId)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (data.status === "success") {

                    showMessage(
                        "Expense deleted successfully.",
                        "success"
                    );

                    loadExpenses();

                }

                else {

                    showMessage(
                        data.message ||
                        "Delete failed.",
                        "error"
                    );

                }

            }

            catch (error) {

                showMessage(
                    "Server connection error.",
                    "error"
                );

            }

        }


        // =========================
        // CLEAR FORM
        // =========================

        function clearForm() {

            editingExpenseId = null;


            document.getElementById(
                "category"
            ).value = "";


            document.getElementById(
                "amount"
            ).value = "";


            document.getElementById(
                "description"
            ).value = "";


            document.getElementById(
                "date"
            ).value = "";


            document.getElementById(
                "formTitle"
            ).textContent =
                "➕ Add Expense";


            document.getElementById(
                "saveBtn"
            ).textContent =
                "➕ Add Expense";


            document.getElementById(
                "cancelBtn"
            ).style.display =
                "none";

        }


        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            message,
            type
        ) {

            const box =
                document.getElementById(
                    "message"
                );


            box.textContent = message;

            box.className =
                "message " + type;

            box.style.display =
                "block";


            setTimeout(() => {

                box.style.display =
                    "none";

            }, 3000);

        }


        // =========================
        // HTML SECURITY
        // =========================

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        // =========================
        // INITIAL LOAD
        // =========================

        loadExpenses();

    </script>

</body>

</html>
